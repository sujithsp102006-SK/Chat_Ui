<!DOCTYPE html>
<html>
<head>
  <title>Chat App</title>
  <link rel="stylesheet" href="me.css">
</head>

<body>

<div class="chat-box">

  <div class="top">
    <div class="user">💬 Chat</div>
    <div class="status">Online</div>
  </div>

  <div class="messages">

    <div class="msg left">
      <p>Hey! How are you?</p>
      <span>10:12 AM</span>
    </div>

    <div class="msg right">
      <p>I’m good 😄 Working on a project.</p>
      <span>10:13 AM</span>
    </div>

    <div class="msg left">
      <p>Nice! Need any help?</p>
      <span>10:14 AM</span>
    </div>

  </div>

  <div class="type">
    <input type="text" placeholder="Type a message...">
    <button>Send</button>
  </div>

</div>

</body>
</html>
